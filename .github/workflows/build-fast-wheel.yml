name: Build fast-engine wheels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fast_env/**"
      - "rust/kaggriculture_env/**"
      - "pyproject.toml"
      - ".github/workflows/build-fast-wheel.yml"

permissions:
  contents: read

jobs:
  linux-wheel:
    name: Linux CPython ${{ matrix.python-version }} wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build manylinux x86_64 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          args: >-
            --release
            --out dist
            --interpreter python${{ matrix.python-version }}
          manylinux: "2014"
          sccache: "true"

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Fast-engine import/reset smoke
        shell: bash
        run: |
          python - <<'PY'
          from fast_env import FastKaggricultureEnv

          env = FastKaggricultureEnv(configuration={"seed": 7})
          obs = env.reset()
          assert len(obs) == 2
          assert obs[0]["day"] == 0 and obs[0]["hour"] == 0

          action = {"farmer": ["PASS"], "hands": [], "market": []}
          for _ in range(4):
              obs, rewards, statuses = env.step([action, action])
          assert len(obs) == 2 and len(rewards) == 2 and len(statuses) == 2
          print("fast engine wheel smoke OK")
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-fast-py${{ matrix.python-version }}-linux-x86_64-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
